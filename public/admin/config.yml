backend:
  name: github
  repo: bgartner/texflow-site
  branch: main
  site_domain: texflow-site.vercel.app
  base_url: https://texflow-site.vercel.app
  auth_endpoint: oauth

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição", name: "description", widget: "text" }
      - { label: "Data de Publicação", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, default: "2026-01-01" }
      - { label: "Imagem de Destaque", name: "image", widget: "image" }
      - { label: "Texto Alternativo da Imagem", name: "imageAlt", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Autor", name: "author", widget: "string", required: false, default: "Equipe TexFlow" }
      - { label: "Rascunho", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "Corpo do Post", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Galeria"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: false }
      - { label: "Imagem", name: "image", widget: "image", media_folder: "/public/images/gallery", public_folder: "/images/gallery" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Alimentícia", value: "Alimentícia" }
          - { label: "Selagem", value: "Selagem" }
          - { label: "Rotomoldagem e EPS", value: "Rotomoldagem e EPS" }
          - { label: "Injeção e Extrusão", value: "Injeção e Extrusão" }
          - { label: "Gráfica", value: "Gráfica" }
          - { label: "Revestimento Antiaderente Industrial", value: "Revestimento Antiaderente Industrial" }
          - { label: "Revestimento Antiaderente Alimentício", value: "Revestimento Antiaderente Alimentício" }
          - { label: "Texturização Industrial", value: "Texturização Industrial" }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Destacar na Home?", name: "featured", widget: "boolean", default: false, hint: "Só fotos marcadas aqui aparecem na galeria da página inicial." }
      - { label: "Foto Principal da Categoria", name: "homeCard", widget: "boolean", default: false, hint: "Marque em apenas UMA foto por categoria — é a que aparece no resumo 'Todos' da galeria da home." }
